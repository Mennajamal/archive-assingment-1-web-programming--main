<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Video Player</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        padding: 20px;
      }

      .video-container {
        width: 700px;
        max-width: 100%;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      }

      .video-title {
        color: white;
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
      }

      video {
        width: 100%;
        display: block;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="video-container">
      <h1 class="video-title">🎬 Video Player</h1>

      <!-- Video element (locally hosted) -->
      <video controls loop height="500">
        <source src="./video/فيديو - Facebook_2.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
  </body>
</html>
