<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Examples</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #e4ecfb);
        padding: 40px 20px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      .section {
        background: white;
        padding: 25px;
        margin-bottom: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .section h2 {
        color: #15803d;
        margin-bottom: 15px;
      }

      /* Images */
      .image-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .image-container img,
      figure img {
        width: 250px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      figure {
        text-align: center;
      }

      figcaption {
        margin-top: 10px;
        color: #666;
        font-style: italic;
      }

      /* Box Model */
      .box {
        background: #fef3c7;
        border: 3px solid #f59e0b;
        padding: 25px;
        margin-top: 15px;
        border-radius: 12px;
        font-weight: bold;
      }

      /* Inline */
      .inline-example {
        font-size: 18px;
      }

      .inline-example span {
        background: #fde047;
        padding: 4px 8px;
        border-radius: 6px;
      }

      /* Block */
      .block-example div {
        background: #bfdbfe;
        padding: 15px;
        margin: 10px 0;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s;
      }

      .block-example div:hover {
        transform: translateX(10px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Images -->
      <section class="section">
        <h2>🖼 Images</h2>

        <div class="image-container">
          <img src="./img/Veggie-Pizza-12.jpg" alt="Pizza image" />
        </div>
      </section>

      <!-- Box Model -->
      <section class="section">
        <h2>📦 Box Model</h2>

        <div class="box">
          This box demonstrates:
          <br />✔ Padding <br />✔ Margin <br />✔ Border
        </div>
      </section>

      <!-- Inline -->
      <section class="section">
        <h2>📝 Inline Elements</h2>

        <p class="inline-example">
          This is <span>inline</span> text inside a paragraph.
        </p>
      </section>

      <!-- Block -->
      <section class="section">
        <h2>🏗 Block Elements</h2>

        <div class="block-example">
          <div>Block Item 1</div>
          <div>Block Item 2</div>
        </div>
      </section>
    </div>
  </body>
</html>
