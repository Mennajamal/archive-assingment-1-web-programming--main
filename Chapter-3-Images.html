<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Furniture</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

h1{
    color:#ffcc66;
    margin:20px 0;
}

.furniture-card{
    width:260px;
    margin:20px auto;
    padding:15px;
    background:#111;
    border-left:3px solid #ffcc66;
    border-radius:8px;
}

.furniture-card img{
    width:100%;
    border-radius:6px;
}

.item-name{
    margin-top:10px;
    font-size:18px;
}

.copyright{
    margin-top:8px;
    font-size:11px;
    color:#bdbdbd;
}
</style>
</head>

<body>

<h1>Modern Furniture Collection — Sofa, Chair, Table</h1>

<div class="furniture-card">
    <img src="./img/chair.jpg" alt="Modern Sofa">
    <div class="item-name">Luxury Modern Sofa</div>
    <div class="copyright">
        ©️ Google Images — Used for educational purposes only.
    </div>
</div>

<div class="furniture-card">
    <img src="./img/chairrr.jpg" alt="Designer Chair">
    <div class="item-name">Designer Arm Chair</div>
    <div class="copyright">
        ©️ Google Images — Used for educational purposes only.
    </div>
</div>

<div class="furniture-card">
    <img src="./img/table.jpg" alt="Wooden Table">
    <div class="item-name">Minimal Wooden Table</div>
    <div class="copyright">
        ©️ Google Images — Used for educational purposes only.
    </div>
</div>

</body>
</html>
